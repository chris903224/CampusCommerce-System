server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax

spring:
  profiles:
    active: ${SPRING_PROFILE:dev}
  
  application:
    name: backend
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edusupplydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Chris123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        enable_lazy_load_no_trans: true
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:suppliessjc@gmail.com}
    password: ${GMAIL_APP_PASSWORD:esrxyvzlwoplnlku}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true

logging:
  level:
    root: INFO
    com.example.backend: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
  file:
    name: ./logs/application.log
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{HH:mm:ss} - %msg%n"

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000
  refresh-expiration: 604800000

otp:
  expiration-minutes: 5
  length: 6

paymongo:
  secret:
    key: ${PAYMONGO_SECRET_KEY:sk_test_placeholder}
  public:
    key: ${PAYMONGO_PUBLIC_KEY:pk_test_placeholder}
  api:
    url: https://api.paymongo.com/v1
  webhook:
    secret: ${PAYMONGO_WEBHOOK_SECRET:}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Requested-With,Accept
  allow-credentials: true

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always